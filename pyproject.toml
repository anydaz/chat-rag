[project]
name = "rag-project"
version = "0.1.0"
description = "RAG project with LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "langchain-openai>=1.2.1",
    "chromadb>=0.3.21",
    "pypdf>=3.0.0",
    "langchain-text-splitters>=0.0.1",
    "langsmith>=0.0.1",
    "python-docx>=0.8.11",
    "langchain-google-community[calendar]>=0.1.0",
    "python-multipart>=0.0.6",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
